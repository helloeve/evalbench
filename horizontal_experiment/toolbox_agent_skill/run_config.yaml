# Variant: toolbox_agent_skill (helloeve/cloud-sql-postgresql @ main).
# Per-domain Cloud SQL Postgres skills bundled as a local Claude Code plugin
# marketplace. Run from the evalbench repo root:
#   uv run python evalbench/evalbench.py \
#     --experiment_config horizontal_experiment/toolbox_agent_skill/run_config.yaml

############################################################
### Dataset
############################################################
dataset_config: horizontal_experiment/dataset.json
dataset_format: agent-format

############################################################
### Orchestrator + Models
############################################################
orchestrator: agent
model_config: horizontal_experiment/toolbox_agent_skill/claude_code_model.yaml
simulated_user_model_config: horizontal_experiment/judge_model.yaml

runners:
  agent_runners: 1

############################################################
### Scorers
############################################################
scorers:
  # Qualitative (judge-based)
  goal_completion:
    model_config: horizontal_experiment/judge_model.yaml

  # Performance / trajectory
  turn_count: {}
  end_to_end_latency: {}
  tool_call_latency: {}
  token_consumption: {}
  skills_trajectory: {}

############################################################
### Reporting
############################################################
reporting:
  csv:
    output_directory: 'results/horizontal_experiment/toolbox_agent_skill'
