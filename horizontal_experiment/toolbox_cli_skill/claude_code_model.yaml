# Variant: toolbox_cli_skill -- helloeve/cloud-sql-postgresql @ toolbox-cli.
# A single unified skill under skills/cloud-sql-postgres/ that documents
# `toolbox --prebuilt cloud-sql-postgres list-tools | describe-tool | invoke`
# and lets the agent drive the MCP Toolbox CLI directly.
#
# The skills_dir path is populated by horizontal_experiment/setup_skills.sh,
# which also writes a .claude-plugin/marketplace.json into the clone.
#
# CLOUD_SQL_POSTGRES_* are NOT listed under env: on purpose -- the toolbox
# CLI reads them directly from the parent shell's environment. Export them
# before running this variant. See horizontal_experiment/README.md.

claude_code_version: "@anthropic-ai/claude-code@2.1.145"
generator: claude_code

model: "claude-opus-4-8"

use_vertex: true
vertex_project_id: "astana-evaluation"
vertex_region: "global"

env:
  GOOGLE_CLOUD_PROJECT: "astana-evaluation"
  GOOGLE_CLOUD_LOCATION: "us-central1"

setup:
  skills_dir: "/Users/whaoyu/git/evalbench/horizontal_experiment/_skills/toolbox-cli"
